<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rádio Online</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <img src="assets/logo.png" alt="Logo Rádio Online" class="logo">
    <h1>Rádio Online</h1>
  </header>

  <section class="player">
    <h2>Ouça ao Vivo</h2>
    <audio id="radioPlayer" preload="auto">
      <source src="http://jovempan.stream.redetv.com.br:8000/jovempan.mp3" type="audio/mpeg">
      Seu navegador não suporta o player de áudio.
    </audio>
    <button id="playButton" class="fixed-play">▶️</button>
  </section>

  <section class="programacao">
    <h2>Programação</h2>
    <table>
      <tr>
        <th>Horário</th>
        <th>Programa</th>
      </tr>
      <tr>
        <td>06:00 - 10:00</td>
        <td>Alisson Silvaes</td>
      </tr>
      <tr>
        <td>10:00 - 14:00</td>
        <td>Locutor 2</td>
      </tr>
      <tr>
        <td>14:00 - 18:00</td>
        <td>Locutor 3</td>
      </tr>
      <tr>
        <td>18:00 - 22:00</td>
        <td>Locutor 4</td>
      </tr>
      <tr>
        <td>22:00 - 06:00</td>
        <td>Músicas e Hits</td>
      </tr>
    </table>
  </section>

  <footer>
    <p>© 2026 Rádio Online. Todos os direitos reservados.</p>
  </footer>

  <script>
    const player = document.getElementById('radioPlayer');
    const playButton = document.getElementById('playButton');

    // Tenta autoplay (pode ser bloqueado em alguns navegadores)
    window.addEventListener('load', () => {
      player.play().catch(() => {
        // Autoplay bloqueado, o botão fica visível
        playButton.style.display = 'inline-block';
      });
    });

    // Alterna play/pause
    playButton.addEventListener('click', () => {
      if(player.paused){
        player.play();
        playButton.textContent = '⏸️';
      } else {
        player.pause();
        playButton.textContent = '▶️';
      }
    });
  </script>
</body>
</html>
