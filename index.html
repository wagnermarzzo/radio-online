<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rádio Online (Teste Som)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Rádio Online — Teste de Som</h1>
  </header>

  <section class="player">
    <h2>Ouça Agora</h2>
    <audio id="radioPlayer" preload="auto">
      <source src="https://ice1.somafm.com/groovesalad-128-mp3" type="audio/mpeg">
      Seu navegador não suporta o player de áudio.
    </audio>
    <button id="playButton">▶️ Tocar / ⏸️ Pausar</button>
  </section>

  <script>
    const player = document.getElementById('radioPlayer');
    const playButton = document.getElementById('playButton');

    playButton.addEventListener('click', () => {
      if (player.paused) {
        player.play();
        playButton.textContent = '⏸️ Pausar';
      } else {
        player.pause();
        playButton.textContent = '▶️ Tocar';
      }
    });
  </script>
</body>
</html>
